<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oversized Outline Fixture</title>
  </head>
  <body>
    <main>
      <h1>Oversized outline fixture</h1>
      <nav id="large-link-list" aria-label="Evidence records"></nav>
    </main>

    <script>
      const list = document.querySelector('#large-link-list');
      for (let index = 1; index <= 120; index += 1) {
        const link = document.createElement('a');
        link.href = `/record-${index}.html`;
        link.textContent = `Evidence record ${index}`;
        list.append(link, document.createElement('br'));
      }
    </script>
  </body>
</html>
